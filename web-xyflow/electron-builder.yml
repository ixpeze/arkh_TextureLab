appId: com.arkh.texturelab
productName: TextureLab
publish: null
directories:
  output: ../release
  buildResources: build
files:
  - dist/**/*
  - dist-desktop/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powertags,example,examples}"
  - "!samples/4k/**"
  - "!**/*.map"
extraResources:
  - from: ../samples/1k
    to: samples/1k
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: TextureLab
  artifactName: "${productName}-Setup-${version}.${ext}"
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
asar: true
